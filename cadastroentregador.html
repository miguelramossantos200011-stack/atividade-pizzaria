<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./cadastroentregador.css">
    <title>Cadastro - Pizzaria Forno e Código</title>
</head>
<body>
    
    <main>
        <div class="cadastro">
            <div class="subtitulo">
                <h2>Cadastro de Entregador</h2>
            </div>

            <div class="prgts">
                <label for="CNome">Nome completo:</label>
                <input name="nome" type="text" id="CNome" placeholder="Digite seu nome completo">
            </div>

            <div class="prgts">
                <label for="CCpf">CPF:</label>
                <input name="cpf" type="number" id="CCpf" placeholder="111.111.111-11">
            </div>

            <div class="prgts">
                <label for="CEndereco">Endereço:</label>
                <input name="endereco" type="text" id="CEndereco" placeholder="Rua, número, bairro">
            </div>

            <div class="prgts">
                <label for="CEmail">CNH:</label>
                <input name="email" type="number" id="CEmail" placeholder="000.000.000-00">
            </div>

            <div class="prgts">
                <label for="CTelefone">Telefone:</label>
                <input name="telefone" type="tel" id="CTelefone" placeholder="(00) 00000-0000">
            </div>

            <div class="prgts">
                <label for="CSenha">Senha:</label>
                <input name="senha" type="password" id="CSenha" placeholder="Digite sua senha">
            </div>

            <div class="prgts">
                <label for="CSenhaConfirmar">Confirmar senha:</label>
                <input name="senha_confirmar" type="password" id="CSenhaConfirmar" placeholder="Confirme sua senha">
            </div>
                <div class="prgts">
                <label for="CVeículo">Veículo :</label>
                <input name="veiculo" type="text" id="CVeículo" placeholder="Ex: Moto, Carro">
            </div>

            <div class="prgts botao-container">
                <button type="submit" class="botao-enviar">Cadastrar</button>
            </div>
        </div>
    </main>

    <footer>
        <h3>R. Lima-Mei, 6969 - Teukumiadora - Japão</h3>
    </footer>
</body>
</html>
